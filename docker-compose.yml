services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/ongc_intelliassist.db:/app/ongc_intelliassist.db
    environment:
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in your local environment or .env file}
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
